name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissão para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy roda por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Lint / Static Analysis ──────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Lint HTML
        run: htmlhint src/index.html --config .htmlhintrc

      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: Lint CSS
        run: stylelint "src/**/*.css" --config '{"extends":"stylelint-config-standard"}'

  # ── Job 2: Build ────────────────────────────────────────────────────
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t curriculo:ci .

      - name: Smoke test (container starts and serves)
        run: |
          docker run -d -p 8080:80 --name curriculo-test curriculo:ci
          sleep 3
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8080)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Container não respondeu com 200!"
            exit 1
          fi
          echo "✅ Build OK"
          docker stop curriculo-test

      - name: Upload artifact for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/

  # ── Job 3: Deploy (apenas na main) ─────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
